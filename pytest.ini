[pytest]
testpaths = tests

# --strict-markers hace fallar el test si se usa un marker no declarado aqui.
# Sin esto, un `@pytest.mark.integracion` mal escrito pasaria desapercibido.
addopts = --strict-markers

markers =
    integration: tests que se comunican con servicios externos reales

# No se fija `-m "not integration"` a proposito: si se hiciera, `pytest -m
# integration` tendria que luchar contra el valor por defecto. Sin un marker
# por defecto, los tres comandos siguientes funcionan tal cual:
#
#   pytest -v
#   pytest -m "not integration" -v
#   pytest -m integration -v

# Los tests no necesitan trazas ni warnings: sin esto, un warning de una
# dependencia externa puede hacer fallar la suite segun la version instalada.
filterwarnings =
    error::DeprecationWarning:peliculas.*
    ignore::DeprecationWarning

[coverage:run]
# Solo se mide el codigo de produccion. Medir los propios tests no aporta nada
# y ademas infla el porcentaje.
source = .
omit =
    tests/*

branch = True

[coverage:report]
show_missing = True
# `fail_under` se deja deliberadamente sin fijar: la prioridad de esta fase son
# tests utiles, no perseguir un porcentaje. Un umbral duro invita a escribir
# tests sin valor para alcanzarlo.
skip_empty = True
exclude_also =
    if TYPE_CHECKING:
    raise NotImplementedError
    if __name__ == .__main__.:
